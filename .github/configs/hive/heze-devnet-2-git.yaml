# Hive client file for the heze-devnet-2 workflows:
# every client built from source.
#
# Alternative to heze-devnet-2.yaml, for tip-of-branch builds when an image is stale or
# missing. Select it with the client_file input of a manual workflow dispatch.

# besu
- client: besu
  nametag: default
  dockerfile: git
  build_args:
    github: besu-eth/besu
    tag: heze-devnet-2

# ethrex
- client: ethrex
  nametag: default
  dockerfile: git
  build_args:
    github: lambdaclass/ethrex
    tag: heze-devnet-2

# nethermind
- client: nethermind
  nametag: default
  dockerfile: git
  build_args:
    github: NethermindEth/nethermind
    tag: heze-devnet-2

# nimbus-el
- client: nimbus-el
  nametag: default
  dockerfile: git
  build_args:
    github: status-im/nimbus-eth1
    tag: heze-devnet-2

# reth
- client: reth
  nametag: default
  dockerfile: git
  build_args:
    github: paradigmxyz/reth
    tag: heze-devnet-2
