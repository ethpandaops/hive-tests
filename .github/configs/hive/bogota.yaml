# Hive client file for the bogota workflows:
# every client from its prebuilt ethpandaops image.
#
# `${DEVNET}` is the devnet the fixtures release targets, bogota-devnet-N for
# a tests-bogota-devnet@vN.y.z release. The workflow fills it in from the
# resolved release, so a new devnet needs no change here as long as every
# client branches as bogota-devnet-N in its upstream repository.
#
# Every client uses the prebuilt ethpandaops image for that branch (build_args
# baseimage/tag). Image tags follow the branches ethpandaops builds, bogota-devnet-N
# is a common EL branch there:
# https://github.com/ethpandaops/eth-client-docker-image-builder/blob/master/branches.yaml
# bogota-git.yaml builds every client from source instead.

# ethrex
- client: ethrex
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/ethrex
    tag: ${DEVNET}

# go-ethereum
- client: go-ethereum
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/geth
    tag: ${DEVNET}

# nethermind
- client: nethermind
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nethermind
    tag: ${DEVNET}

# reth
- client: reth
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/reth
    tag: ${DEVNET}

# EELS simulators (ethereum/eels/*) run the images ethereum/execution-specs
# publishes. `tag` follows the fixtures_tag input: `bogota-devnet-N`, the
# highest bogota-devnet release of devnet N with the framework at the head
# of its devnets branch, or the pinned release's image, e.g.
# bogota-devnet-v1.1.0. Simulators not listed here use their defaults.
# To build one from source instead, give it `dockerfile: git` and the
# execution-specs branch and fixtures release to use:
#
# - simulator: ethereum/eels/consume-engine
#   dockerfile: git
#   build_args:
#     branch: devnets/bogota/1
#     fixtures: tests-bogota-devnet@v1.1.0
- simulator: ethereum/eels/consume-engine
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-enginex
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-rlp
  build_args:
    tag: ${EELS_IMAGE_TAG}
