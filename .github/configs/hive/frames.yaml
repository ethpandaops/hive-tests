# Hive client file for the frames workflows:
# every client from its prebuilt ethpandaops image.
#
# `${DEVNET}` is the devnet the fixtures release targets, frames-devnet-N for
# a tests-frames-devnet@vN.y.z release. The workflow fills it in from the
# resolved release, so a new devnet needs no change here as long as every
# client branches as frames-devnet-N in its upstream repository.
#
# Every client uses the prebuilt ethpandaops image for that branch (build_args
# baseimage/tag). Image tags follow the branches ethpandaops builds, frames-devnet-N
# is a common EL branch there:
# https://github.com/ethpandaops/eth-client-docker-image-builder/blob/master/branches.yaml
# frames-git.yaml builds every client from source instead.

# ethrex
- client: ethrex
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/ethrex
    tag: ${DEVNET}

# go-ethereum
- client: go-ethereum
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/geth
    tag: ${DEVNET}

# nethermind
- client: nethermind
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nethermind
    tag: ${DEVNET}

# reth
- client: reth
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/reth
    tag: ${DEVNET}
