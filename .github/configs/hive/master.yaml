# Hive client file for the generic workflows:
# the best available source per client.
#
# Clients with a prebuilt ethpandaops image for this set use it (build_args
# baseimage/tag); a client without one is built from source inside the run
# (dockerfile: git). master-git.yaml builds every client from source.
#
# Image tags follow the branches ethpandaops builds:
# https://github.com/ethpandaops/eth-client-docker-image-builder/blob/master/branches.yaml

# besu
- client: besu
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/besu
    tag: main

# erigon
- client: erigon
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/erigon
    tag: main

# ethrex
- client: ethrex
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/ethrex
    tag: main

# go-ethereum
- client: go-ethereum
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/geth
    tag: master

# nethermind
- client: nethermind
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nethermind
    tag: master

# nimbus-el
- client: nimbus-el
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nimbus-eth1
    tag: master

# reth
- client: reth
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/reth
    tag: main

# EELS simulators (ethereum/eels/*) run the images ethereum/execution-specs
# publishes. `tag` follows the fixtures_tag input: `latest`, the highest
# tests@ release with the framework at the head of the default branch, or
# the pinned release's image, e.g. v21.0.1. Simulators not listed here use
# their defaults.
# To build one from source instead, give it `dockerfile: git` and the
# execution-specs branch and fixtures release to use:
#
# - simulator: ethereum/eels/consume-engine
#   dockerfile: git
#   build_args:
#     branch: forks/bogota
#     fixtures: tests@v21.0.1
- simulator: ethereum/eels/consume-engine
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-enginex
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-rlp
  build_args:
    tag: ${EELS_IMAGE_TAG}
