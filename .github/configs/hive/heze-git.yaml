# Hive client file for the heze workflows:
# every client built from source.
#
# `${DEVNET}` is the devnet the fixtures release targets, heze-devnet-N for
# a tests-heze-devnet@vN.y.z release. The workflow fills it in from the
# resolved release, so a new devnet needs no change here as long as every
# client branches as heze-devnet-N in its upstream repository.
#
# Every client is built from source inside the run (dockerfile: git) from its
# heze-devnet-N branch, with no dependency on the ethpandaops image builder,
# for tip-of-branch builds when an image is stale or missing. Select it with
# the client_file input of a manual workflow dispatch. heze.yaml, the
# default, uses the prebuilt images.

# besu
- client: besu
  nametag: default
  dockerfile: git
  build_args:
    github: besu-eth/besu
    tag: ${DEVNET}

# ethrex
- client: ethrex
  nametag: default
  dockerfile: git
  build_args:
    github: lambdaclass/ethrex
    tag: ${DEVNET}

# nethermind
- client: nethermind
  nametag: default
  dockerfile: git
  build_args:
    github: NethermindEth/nethermind
    tag: ${DEVNET}

# nimbus-el
- client: nimbus-el
  nametag: default
  dockerfile: git
  build_args:
    github: status-im/nimbus-eth1
    tag: ${DEVNET}

# reth
- client: reth
  nametag: default
  dockerfile: git
  build_args:
    github: paradigmxyz/reth
    tag: ${DEVNET}

# EELS simulators (ethereum/eels/*) run the images ethereum/execution-specs
# publishes. `tag` follows the fixtures_tag input: `heze-devnet-N`, the
# highest heze-devnet release of devnet N with the framework at the head
# of its devnets branch, or the pinned release's image, e.g.
# heze-devnet-v2.0.1. Simulators not listed here use their defaults.
# To build one from source instead, give it `dockerfile: git` and the
# execution-specs branch and fixtures release to use:
#
# - simulator: ethereum/eels/consume-engine
#   dockerfile: git
#   build_args:
#     branch: devnets/heze/2
#     fixtures: tests-heze-devnet@v2.0.1
- simulator: ethereum/eels/consume-engine
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-enginex
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-rlp
  build_args:
    tag: ${EELS_IMAGE_TAG}
