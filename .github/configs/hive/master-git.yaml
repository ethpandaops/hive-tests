# Hive client file for the mainnet workflows:
# every client built from source.
#
# Alternative to master.yaml, for tip-of-branch builds when an image is stale or
# missing. Select it with the client_file input of a manual workflow dispatch.

# besu
- client: besu
  nametag: default
  dockerfile: git
  build_args:
    github: besu-eth/besu
    tag: main

# erigon
- client: erigon
  nametag: default
  dockerfile: git
  build_args:
    github: erigontech/erigon
    tag: main

# ethrex
- client: ethrex
  nametag: default
  dockerfile: git
  build_args:
    github: lambdaclass/ethrex
    tag: main

# go-ethereum
- client: go-ethereum
  nametag: default
  dockerfile: git
  build_args:
    github: ethereum/go-ethereum
    tag: master

# nethermind
- client: nethermind
  nametag: default
  dockerfile: git
  build_args:
    github: NethermindEth/nethermind
    tag: master

# nimbus-el
- client: nimbus-el
  nametag: default
  dockerfile: git
  build_args:
    github: status-im/nimbus-eth1
    tag: master

# reth
- client: reth
  nametag: default
  dockerfile: git
  build_args:
    github: paradigmxyz/reth
    tag: main

# EELS simulators (ethereum/eels/*) run the images ethereum/execution-specs
# publishes. `tag` follows the fixtures_tag input: `latest`, the highest
# tests@ release with the framework at the head of the default branch, or
# the pinned release's image, e.g. v21.0.1. Simulators not listed here use
# their defaults.
# To build one from source instead, give it `dockerfile: git` and the
# execution-specs branch and fixtures release to use:
#
# - simulator: ethereum/eels/consume-engine
#   dockerfile: git
#   build_args:
#     branch: forks/bogota
#     fixtures: tests@v21.0.1
- simulator: ethereum/eels/consume-engine
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-enginex
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/consume-rlp
  build_args:
    tag: ${EELS_IMAGE_TAG}
- simulator: ethereum/eels/execute-blobs
  build_args:
    tag: ${EELS_IMAGE_TAG}
    fork: Amsterdam
