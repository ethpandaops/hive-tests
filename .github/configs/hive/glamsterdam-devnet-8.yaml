# Hive client file for the glamsterdam-devnet-8 workflows:
# the best available source per client.
#
# Clients with a prebuilt ethpandaops image for this set use it (build_args
# baseimage/tag); a client without one is built from source inside the run
# (dockerfile: git). glamsterdam-devnet-8-git.yaml builds every client from source.
#
# Image tags follow the branches ethpandaops builds:
# https://github.com/ethpandaops/eth-client-docker-image-builder/blob/master/branches.yaml

# besu
- client: besu
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/besu
    tag: main

# erigon
- client: erigon
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/erigon
    tag: glamsterdam-devnet-8

# ethrex
- client: ethrex
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/ethrex
    tag: glamsterdam-devnet-8

# go-ethereum
- client: go-ethereum
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/geth
    tag: master

# nethermind
- client: nethermind
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nethermind
    tag: master

# nimbus-el
- client: nimbus-el
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nimbus-eth1
    tag: master

# reth
- client: reth
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/reth
    tag: glamsterdam-devnet-8
