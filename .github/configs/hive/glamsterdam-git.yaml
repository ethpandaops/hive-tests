# Hive client file for the glamsterdam workflows:
# every client built from source.
#
# Alternative to glamsterdam.yaml, for tip-of-branch builds when an image is stale or
# missing. Select it with the client_file input of a manual workflow dispatch.

# besu
- client: besu
  nametag: default
  dockerfile: git
  build_args:
    github: besu-eth/besu
    tag: main

# erigon
- client: erigon
  nametag: default
  dockerfile: git
  build_args:
    github: erigontech/erigon
    tag: main

# ethrex
- client: ethrex
  nametag: default
  dockerfile: git
  build_args:
    github: lambdaclass/ethrex
    tag: main

# go-ethereum
- client: go-ethereum
  nametag: default
  dockerfile: git
  build_args:
    github: ethereum/go-ethereum
    tag: master

# nethermind
- client: nethermind
  nametag: default
  dockerfile: git
  build_args:
    github: NethermindEth/nethermind
    tag: master

# nimbus-el
- client: nimbus-el
  nametag: default
  dockerfile: git
  build_args:
    github: status-im/nimbus-eth1
    tag: master

# reth
- client: reth
  nametag: default
  dockerfile: git
  build_args:
    github: paradigmxyz/reth
    tag: main

# EELS simulators (ethereum/eels/*) run the images ethereum/execution-specs
# publishes. `latest` is the highest tests@ release with the framework at
# the head of the default branch; pin a release, e.g. v21.0.1, to keep the
# tests fixed. Simulators not listed here use their defaults.
# To build one from source instead, give it `dockerfile: git` and the
# execution-specs branch and fixtures release to use:
#
# - simulator: ethereum/eels/consume-engine
#   dockerfile: git
#   build_args:
#     branch: forks/bogota
#     fixtures: tests@v21.0.1
- simulator: ethereum/eels/consume-engine
  build_args:
    tag: latest
- simulator: ethereum/eels/consume-enginex
  build_args:
    tag: latest
- simulator: ethereum/eels/consume-rlp
  build_args:
    tag: latest
- simulator: ethereum/eels/execute-blobs
  build_args:
    tag: latest
    fork: Amsterdam
