# Hive client file for the heze-devnet-2 workflows:
# the best available source per client.
#
# Clients with a prebuilt ethpandaops image for this set use it (build_args
# baseimage/tag); a client without one is built from source inside the run
# (dockerfile: git). heze-devnet-2-git.yaml builds every client from source.
#
# Image tags follow the branches ethpandaops builds:
# https://github.com/ethpandaops/eth-client-docker-image-builder/blob/master/branches.yaml

# besu
- client: besu
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/besu
    tag: heze-devnet-2

# ethrex
- client: ethrex
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/ethrex
    tag: heze-devnet-2

# nethermind
- client: nethermind
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nethermind
    tag: heze-devnet-2

# nimbus-el
- client: nimbus-el
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/nimbus-eth1
    tag: heze-devnet-2

# reth
- client: reth
  nametag: default
  build_args:
    baseimage: docker.ethquokkaops.io/dh/ethpandaops/reth
    tag: heze-devnet-2
