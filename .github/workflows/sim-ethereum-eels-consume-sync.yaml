name: ethereum/eels/consume-sync (eels/consume-sync)
on:
  workflow_dispatch:

jobs:
  trigger-mainnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mainnet.yaml',
              ref: 'master',
              inputs: {
                simulator: '["ethereum/eels/consume-sync"]',
                // consume-sync syncs each client from every client given to
                // hive, so all clients run in one job
                client_matrix: 'false',
                concurrency_group: 'eels-consume-sync',
                timeout_minutes: '300'
              }
            });
