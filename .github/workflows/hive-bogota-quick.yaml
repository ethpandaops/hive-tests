name: Hive - Bogota Quick
# The workflow name alone does not tell dispatched runs apart, so the run
# title names the clients and simulators (and the fixtures tag when pinned).
run-name: >-
  Hive - Bogota Quick: ${{ join(fromJSON(format('[{0}]', inputs.client)), ', ') || 'default clients' }} with
  ${{ join(fromJSON(format('[{0}]', inputs.simulator)), ', ') || 'default simulators' }}${{ inputs.fixtures_tag && format(' ({0})', inputs.fixtures_tag) || '' }}
on:
  workflow_dispatch:
    inputs:
      fixtures_tag:
        type: string
        default: ""
        description: >-
          Pin a fixtures release tag e.g. tests-bogota-devnet@v1.1.0 to
          run that release's EELS simulator image. Empty follows the
          bogota-devnet-N image of the greatest published
          tests-bogota-devnet tag. The client branches
          (bogota-devnet-N) follow the tag's major version.
      client:
        type: string
        default: '"go-ethereum","nethermind","ethrex","reth"'
        description: Comma-separated list of clients to test .e.g go-ethereum, nethermind, ethrex, reth
      simulator:
        type: string
        default: >-
          "ethereum/eels/consume-engine",
          "ethereum/eels/consume-enginex",
          "ethereum/eels/consume-rlp"
        description: >-
          Comma-separated list of simulators to test
          .e.g ethereum/eels/consume-engine, ethereum/eels/consume-enginex, ethereum/eels/consume-rlp
      hive_version:
        type: string
        default: ethereum/hive@master
        description: GitHub repository and tag for hive (repo@tag)
      client_file:
        type: choice
        default: bogota.yaml
        description: >-
          Client file under .github/configs/hive/ defining how each client
          is built. The default uses the prebuilt ethpandaops images of the
          bogota-devnet-N branch; bogota-git.yaml builds every client from source
          from that branch instead.
        options:
          - bogota.yaml
          - bogota-git.yaml
      client_config:
        type: string
        default: ""
        description: >-
          Inline hive client file (YAML) that replaces the client
          entries of client_file, for example to test a branch or an
          image that is not in the repository configuration. Each EELS
          simulator entry of client_file still applies unless it has an
          entry for that simulator.
      workflow_artifact_upload:
        type: boolean
        default: true
        description: Upload test results as a workflow artifact

env:
  # Proxy
  GOPROXY: "${{ vars.GOPROXY }}"
  # Hive action environment variables
  S3_BUCKET: hive-results
  S3_PATH: bogota-quick
  S3_PUBLIC_URL: https://hive.ethpandaops.io/#/test/bogota-quick/
  INSTALL_RCLONE_VERSION: v1.68.2
  # rclone reads its flags from RCLONE_* variables, so these reach the
  # action's upload. consume-engine and consume-rlp write one client log per
  # test (32k files on Bogota), which rclone's default 4 transfers upload in
  # about 40 minutes.
  RCLONE_TRANSFERS: "64"
  RCLONE_CHECKERS: "64"
  # Flags used for all simulators
  GLOBAL_EXTRA_FLAGS: >-
    --client.checktimelimit=300s
    --docker.buildoutput
    --docker.auth
  # Flags used for the ethereum/eels/consume-engine simulator
  EELS_ENGINE_FLAGS: >-
    --sim.parallelism=6
    --sim.limit='.*8141.*'
    --sim.limit.exact=false
    --sim.loglevel=3
  # Flags used for the ethereum/eels/consume-enginex simulator
  EELS_ENGINEX_FLAGS: >-
    --sim.parallelism=4
    --sim.limit='.*8141.*'
    --sim.limit.exact=false
    --sim.loglevel=3
  # Flags used for the ethereum/eels/consume-rlp simulator
  EELS_RLP_FLAGS: >-
    --sim.parallelism=6
    --sim.limit='.*8141.*'
    --sim.limit.exact=false
    --sim.loglevel=3

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      hive_repo: ${{ steps.client_config.outputs.hive_repo }}
      hive_tag: ${{ steps.client_config.outputs.hive_tag }}
      # Hive client file (YAML) rendered from .github/configs/hive/
      client_config: ${{ steps.client_config.outputs.client_config }}
      # Clients that have an image or branch for this run (JSON list)
      clients: ${{ steps.clients.outputs.clients }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: ".github/scripts/*.py"
      # The EELS simulator image tag goes into the client file's simulator
      # entries, so it is resolved before the file is rendered.
      - name: Resolve fixtures release
        id: fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURES_TAG: ${{ inputs.fixtures_tag }}
        run: |
          python3 .github/scripts/resolve_fixtures_release.py \
            --prefix tests-bogota-devnet \
            --devnet-name 'bogota-devnet-{major}'
      - name: Render client config
        id: client_config
        env:
          HIVE_VERSION: ${{ inputs.hive_version || 'ethereum/hive@master' }}
          CLIENT_FILE: ${{ inputs.client_file || 'bogota.yaml' }}
          CLIENT_CONFIG: ${{ inputs.client_config }}
          DEVNET: ${{ steps.fixtures.outputs.devnet }}
          EELS_IMAGE_TAG: ${{ steps.fixtures.outputs.image_tag }}
        run: |
          echo "hive_repo=${HIVE_VERSION%@*}" >> "$GITHUB_OUTPUT"
          echo "hive_tag=${HIVE_VERSION#*@}" >> "$GITHUB_OUTPUT"
          uv run --script .github/scripts/render_client_config.py \
            --file "$CLIENT_FILE" --var "DEVNET=$DEVNET" \
            --var "EELS_IMAGE_TAG=$EELS_IMAGE_TAG"
      # Clients without an image or branch for this run skip here instead of
      # failing their jobs.
      - name: Select the clients to run
        id: clients
        env:
          CLIENTS: ${{ inputs.client || '"go-ethereum","nethermind","ethrex","reth"' }}
          CLIENT_CONFIG: ${{ steps.client_config.outputs.client_config }}
        run: uv run --script .github/scripts/select_clients.py

  test:
    timeout-minutes: 2160
    needs: prepare
    if: needs.prepare.outputs.clients != '[]'
    env:
      # BAL-specific environment variables
      HIVE_PARALLEL_TX_PROCESSING_DISABLED: "true"
      HIVE_AMSTERDAM_TIMESTAMP: "1777456800"
    runs-on: >-
      ${{
        contains(matrix.simulator, 'ethereum/eels/') && 'self-hosted-ghr-size-xl-do-x64' ||
        'ubuntu-latest'
      }}
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.head_ref || 'scheduled' }}-${{ matrix.client }}-${{ matrix.simulator }}
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.prepare.outputs.clients) }}
        simulator: >-
          ${{ fromJSON(format('[{0}]', inputs.simulator || '
            "ethereum/eels/consume-engine",
            "ethereum/eels/consume-enginex",
            "ethereum/eels/consume-rlp"
          '))}}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ethpandaops/hive-github-action/helpers/self-hosted-runner-dependencies@09050fc75bae8a10b1876a0826ca4114ea9ed6e8 # v0.6.3
        if: runner.environment != 'github-hosted'
      - uses: ethpandaops/actions/docker-login@a91b7a8dd6a264f5e845ac2aa52d2d6f24e6d01d
        with:
          username: ethpandaops
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ethpandaops/hive-github-action@09050fc75bae8a10b1876a0826ca4114ea9ed6e8 # v0.6.3
        with:
          hive_repository: ${{ needs.prepare.outputs.hive_repo }}
          hive_version: ${{ needs.prepare.outputs.hive_tag }}
          client: ${{ matrix.client }}
          simulator: ${{ matrix.simulator }}
          client_config: ${{ needs.prepare.outputs.client_config }}
          extra_flags: >-
            ${{ env.GLOBAL_EXTRA_FLAGS }}
            ${{ matrix.simulator == 'ethereum/eels/consume-engine' && env.EELS_ENGINE_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-enginex' && env.EELS_ENGINEX_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-rlp' && env.EELS_RLP_FLAGS || '' }}
          s3_upload: true
          s3_bucket: ${{ env.S3_BUCKET }}
          s3_path: ${{ env.S3_PATH }}
          s3_public_url: ${{ env.S3_PUBLIC_URL }}
          rclone_config: ${{ secrets.HIVE_RCLONE_CONFIG }}
          rclone_version: ${{ env.INSTALL_RCLONE_VERSION }}
          workflow_artifact_upload: ${{ inputs.workflow_artifact_upload }}
          website_upload: true
          website_index_generation: false
      # Add this job's results to the results index, see generate-index.yaml.
      - name: Update the results index
        if: ${{ !cancelled() && env.RUN_SUCCESS == 'true' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TRIGGER: "${{ github.workflow }}: ${{ matrix.client }} with ${{ matrix.simulator }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'generate-index.yaml',
              ref: process.env.GITHUB_REF_NAME,
              inputs: {
                's3-bucket': process.env.S3_BUCKET,
                's3-path': process.env.S3_PATH,
                trigger: process.env.TRIGGER,
              },
            });
