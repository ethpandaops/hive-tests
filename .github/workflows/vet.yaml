name: Vet Workflows
on:
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          # generic.yaml predates the linter with 11 dispatch inputs (limit
          # 10); API dispatches work, so ignored until trimmed deliberately.
          args: -color -shellcheck= -ignore 'maximum number of inputs'

  watch-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Derive the watch plan
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          python3 .github/scripts/derive-watch-plan.py > plan.txt
          cat plan.txt
      - name: Every devnet workflow must be watchable
        run: |
          for wf in .github/workflows/hive-*.yaml; do
            name=$(basename "$wf")
            grep -q "^hive|${name}|" plan.txt \
              || { echo "ERROR: no watch entries derived for ${name}"; exit 1; }
          done
          grep -q '^generic|' plan.txt || { echo "ERROR: no generic entries"; exit 1; }
          grep -q '^sim|' plan.txt || { echo "ERROR: no eels simulator entries"; exit 1; }
