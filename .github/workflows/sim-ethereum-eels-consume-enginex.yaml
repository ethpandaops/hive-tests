name: ethereum/eels/consume-enginex (eels/consume-enginex)
on:
  workflow_dispatch:
  schedule:
    - cron: "15 03 * * *" # Every day at 03:15 UTC

jobs:
  trigger-generic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'generic.yaml',
              ref: 'master',
              inputs: {
                simulator: '["ethereum/eels/consume-enginex"]',
                client: '["besu", "go-ethereum", "reth"]',
                concurrency_group: 'eels-consume-enginex',
                timeout_minutes: '1680'
              }
            });
