name: Hive - Glamsterdam
on:
  schedule:
    - cron: "45 13 * * *"
  workflow_dispatch:
    inputs:
      client:
        type: string
        default: '"go-ethereum","nethermind","nimbus-el","erigon","besu","reth","ethrex"'
        description: Comma-separated list of clients to test .e.g go-ethereum, besu, reth, nethermind, erigon, nimbus-el, ethrex
      simulator:
        type: string
        default: >-
          "ethereum/eels/consume-engine",
          "ethereum/eels/consume-rlp",
          "ethereum/eels/execute-blobs"
        description: >-
          Comma-separated list of simulators to test
          .e.g ethereum/rpc-compat, ethereum/eels/consume-engine, ethereum/eels/consume-rlp, ethereum/eels/execute-blobs
      hive_version:
        type: string
        default: ethereum/hive@master
        description: GitHub repository and tag for hive (repo@tag)
      client_file:
        type: choice
        default: glamsterdam.yaml
        description: >-
          Client file under .github/configs/hive/ defining how each client
          is built. The default is the best available source per client
          (prebuilt ethpandaops images where they exist); the -git file
          builds every client from source.
        options:
          - glamsterdam.yaml
          - glamsterdam-git.yaml
      client_config:
        type: string
        default: ""
        description: >-
          Inline hive client file (YAML) that replaces client_file, for
          example to test a branch or an image that is not in the
          repository configuration.
      workflow_artifact_upload:
        type: boolean
        default: true
        description: Upload test results as a workflow artifact

env:
  # Proxy
  GOPROXY: "${{ vars.GOPROXY }}"
  # Hive action environment variables
  S3_BUCKET: hive-results
  S3_PATH: glamsterdam
  S3_PUBLIC_URL: https://hive.ethpandaops.io/#/test/glamsterdam/
  INSTALL_RCLONE_VERSION: v1.68.2
  # Flags used for all simulators
  GLOBAL_EXTRA_FLAGS: >-
    --client.checktimelimit=300s
    --docker.buildoutput
    --docker.auth
  # Flags used for the ethereum/eels/consume-engine simulator
  EELS_ENGINE_FLAGS: >-
    --sim.parallelism=6
    --sim.buildarg fixtures=${EELS_BUILD_ARG_FIXTURES}
    --sim.buildarg branch=${EELS_BUILD_ARG_BRANCH}
    --sim.limit='.*fork_(Amsterdam|BPO2ToAmsterdamAtTime15k|Osaka).*'
    --sim.limit.exact=false
    --sim.loglevel=3
  # Flags used for the ethereum/eels/consume-rlp simulator
  EELS_RLP_FLAGS: >-
    --sim.parallelism=6
    --sim.buildarg fixtures=${EELS_BUILD_ARG_FIXTURES}
    --sim.buildarg branch=${EELS_BUILD_ARG_BRANCH}
    --sim.limit='.*fork_(Amsterdam|BPO2ToAmsterdamAtTime15k|Osaka).*'
    --sim.limit.exact=false
    --sim.loglevel=3
  # Flags used for the ethereum/eels/execute-blobs simulator
  EELS_EXECUTE_FLAGS: >-
    --sim.buildarg branch=${EELS_BUILD_ARG_BRANCH}
    --sim.buildarg fork=Amsterdam
    --sim.loglevel=3
  # Flags used for the ethereum/rpc-compat simulator
  RPC_COMPAT_FLAGS: >-
    --sim.loglevel=3

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      hive_repo: ${{ steps.client_config.outputs.hive_repo }}
      hive_tag: ${{ steps.client_config.outputs.hive_tag }}
      # Hive client file (YAML) rendered from .github/configs/hive/
      client_config: ${{ steps.client_config.outputs.client_config }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: ".github/scripts/*.py"
      - name: Render client config
        id: client_config
        env:
          HIVE_VERSION: ${{ inputs.hive_version || 'ethereum/hive@master' }}
          CLIENT_FILE: ${{ inputs.client_file || 'glamsterdam.yaml' }}
          CLIENT_CONFIG: ${{ inputs.client_config }}
        run: |
          echo "hive_repo=${HIVE_VERSION%@*}" >> "$GITHUB_OUTPUT"
          echo "hive_tag=${HIVE_VERSION#*@}" >> "$GITHUB_OUTPUT"
          uv run --script .github/scripts/render_client_config.py --file "$CLIENT_FILE"

  test:
    timeout-minutes: 4320
    needs: prepare
    env:
      # BAL-specific environment variables
      HIVE_PARALLEL_TX_PROCESSING_DISABLED: "true"
      HIVE_AMSTERDAM_TIMESTAMP: "1777456800"
      EELS_BUILD_ARG_FIXTURES: "https://github.com/ethereum/execution-specs/releases/download/tests-glamsterdam-devnet@v8.1.4/fixtures_glamsterdam-devnet.tar.gz"
      EELS_BUILD_ARG_BRANCH: "devnets/glamsterdam/8"
    runs-on: >-
      ${{
        matrix.simulator == 'ethereum/rpc-compat' && 'ubuntu-latest' ||
        contains(matrix.simulator, 'ethereum/eels/') && 'self-hosted-ghr-size-ccx33-x64' ||
        'ubuntu-latest'
      }}
    concurrency:
      group: >-
        ${{ github.head_ref || inputs || github.workflow }}-${{ matrix.client }}-${{ matrix.simulator }}
    strategy:
      fail-fast: false
      matrix:
        client: >-
          ${{ fromJSON(format('[{0}]', inputs.client || '
            "besu",
            "go-ethereum",
            "nethermind",
            "reth",
            "nimbus-el",
            "erigon",
            "ethrex"
          '))}}
        simulator: >-
          ${{ fromJSON(format('[{0}]', inputs.simulator || '
            "ethereum/eels/consume-engine",
            "ethereum/eels/consume-rlp",
            "ethereum/eels/execute-blobs"
          '))}}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ethpandaops/hive-github-action/helpers/self-hosted-runner-dependencies@09050fc75bae8a10b1876a0826ca4114ea9ed6e8 # v0.6.3
        if: runner.environment != 'github-hosted'
      - uses: ethpandaops/actions/docker-login@a91b7a8dd6a264f5e845ac2aa52d2d6f24e6d01d
        with:
          username: ethpandaops
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ethpandaops/hive-github-action@09050fc75bae8a10b1876a0826ca4114ea9ed6e8 # v0.6.3
        with:
          hive_repository: ${{ needs.prepare.outputs.hive_repo }}
          hive_version: ${{ needs.prepare.outputs.hive_tag }}
          client: ${{ matrix.client }}
          simulator: ${{ matrix.simulator }}
          client_config: ${{ needs.prepare.outputs.client_config }}
          extra_flags: >-
            ${{ env.GLOBAL_EXTRA_FLAGS }}
            ${{ matrix.simulator == 'ethereum/eels/consume-engine' && env.EELS_ENGINE_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-rlp' && env.EELS_RLP_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/execute-blobs' && env.EELS_EXECUTE_FLAGS || '' }}
          s3_upload: true
          s3_bucket: ${{ env.S3_BUCKET }}
          s3_path: ${{ env.S3_PATH }}
          s3_public_url: ${{ env.S3_PUBLIC_URL }}
          rclone_config: ${{ secrets.HIVE_RCLONE_CONFIG }}
          rclone_version: ${{ env.INSTALL_RCLONE_VERSION }}
          workflow_artifact_upload: >-
            ${{ github.event_name == 'schedule' || inputs.workflow_artifact_upload }}
          website_upload: true
