name: Hive - Watch Images

# Runs the dashboard workflows (hive-*.yaml) and the EELS wrappers
# (sim-ethereum-eels-*.yaml) that have no schedule when the client or EELS
# simulator images they test change, client rebuilds at most every 12 hours
# outside the quick dashboards, and every client and simulator at least
# daily, see .github/scripts/watch_images.py.
# An image build can announce a new image so the check runs right away,
# with a token that can write this repository's contents:
#
#   gh api repos/ethpandaops/hive-tests/dispatches -f event_type=image-pushed
#
# or, with a token that can only run its workflows:
#
#   gh workflow run watch-images.yaml -R ethpandaops/hive-tests
on:
  # A safety net for missed image-pushed events, off the busy top of the hour.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [image-pushed]

env:
  INSTALL_RCLONE_VERSION: v1.68.2
  # The image digests and EELS releases of the previous check.
  STATE_DIR: s3:hive-results
  STATE_FILE: watch-images.json

jobs:
  watch:
    runs-on: ubuntu-latest
    concurrency:
      group: watch-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: ".github/scripts/*.py"
      - uses: AnimMouse/setup-rclone@0d99fa3878a334d3e307c1a8372ad55550fdaea7 # v1.11.0
        with:
          rclone_config: ${{ secrets.HIVE_RCLONE_CONFIG }}
          version: ${{ env.INSTALL_RCLONE_VERSION }}
      - name: Dispatch the runs of changed images
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ethpandaops
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # A missing state starts over, recording the images without
          # dispatching. Any other failure to read it stops the check.
          listed=$(rclone lsf --files-only --include "$STATE_FILE" "$STATE_DIR/")
          if [ -n "$listed" ]; then
            rclone cat "$STATE_DIR/$STATE_FILE" > previous.json
          else
            echo '{}' > previous.json
          fi
          set -o pipefail
          status=0
          uv run --script .github/scripts/watch_images.py \
            --previous previous.json --state state.json --dispatch | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          # Uploaded even when unchanged, so the bucket's expiry never drops
          # it, and after a failed dispatch, so the runs that started are kept.
          if [ -f state.json ]; then
            rclone copyto --ignore-times state.json "$STATE_DIR/$STATE_FILE"
          fi
          exit "$status"
